<!-- library/templates/change_password.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Change Password - Library Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 450px;
            max-width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.3);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
            display: block;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .requirements {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .requirements ul {
            margin-left: 20px;
            margin-top: 5px;
        }
        
        .requirements li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔑 Change Password</h1>
            <p>Update your account password</p>
        </div>
        
        <div class="body">
            <div id="messageContainer"></div>
            
            <form id="changePasswordForm">
                {% csrf_token %}
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" name="current_password" id="current_password" required placeholder="Enter your current password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" id="new_password" required placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" required placeholder="Confirm your new password">
                </div>
                <button type="submit" class="btn">Change Password</button>
            </form>
            
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Processing...</p>
            </div>
            
            <div class="requirements">
                <strong>📌 Password Requirements:</strong>
                <ul>
                    <li>Minimum 4 characters long</li>
                    <li>Cannot be the same as current password</li>
                    <li>Case-sensitive</li>
                </ul>
            </div>
            
            <div class="back-link">
                <a href="javascript:history.back()">← Back to Dashboard</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('changePasswordForm').onsubmit = function(e) {
            e.preventDefault();
            
            let currentPassword = document.getElementById('current_password').value;
            let newPassword = document.getElementById('new_password').value;
            let confirmPassword = document.getElementById('confirm_password').value;
            
            // Validation
            if (!currentPassword) {
                showMessage('error', 'Please enter your current password');
                return;
            }
            
            if (!newPassword) {
                showMessage('error', 'Please enter a new password');
                return;
            }
            
            if (newPassword.length < 4) {
                showMessage('error', 'Password must be at least 4 characters long');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('error', 'New passwords do not match');
                return;
            }
            
            if (currentPassword === newPassword) {
                showMessage('error', 'New password cannot be the same as current password');
                return;
            }
            
            // Show loader
            let loader = document.getElementById('loader');
            let btn = document.querySelector('.btn');
            loader.style.display = 'block';
            btn.disabled = true;
            btn.innerText = 'Processing...';
            
            // Send request
            fetch('{% url "change_password" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new URLSearchParams({
                    'current_password': currentPassword,
                    'new_password': newPassword,
                    'confirm_password': confirmPassword
                })
            })
            .then(response => response.json())
            .then(data => {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = 'Change Password';
                
                if (data.success) {
                    showMessage('success', '✓ Password changed successfully! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '{% url "login" %}';
                    }, 2000);
                } else {
                    showMessage('error', '✗ ' + data.message);
                }
            })
            .catch(error => {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = 'Change Password';
                showMessage('error', 'Network error. Please try again.');
            });
        };
        
        function showMessage(type, message) {
            let container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            setTimeout(() => {
                let msg = document.querySelector('.message');
                if (msg) {
                    msg.style.opacity = '0';
                    setTimeout(() => {
                        msg.remove();
                    }, 500);
                }
            }, 5000);
        }
        
        // Enter key support
        document.getElementById('confirm_password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('changePasswordForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
