<!-- library/templates/register.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration - Library Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .register-container { background: white; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 500px; max-width: 100%; overflow: hidden; }
        
        .register-header { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: white; padding: 30px; text-align: center; }
        .register-header h1 { font-size: 24px; margin-bottom: 10px; }
        .register-header p { opacity: 0.9; font-size: 14px; }
        
        .register-body { padding: 30px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #2ecc71; box-shadow: 0 0 5px rgba(46,204,113,0.3); }
        
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .btn-register { width: 100%; padding: 14px; background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46,204,113,0.3); }
        
        .login-link { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .login-link a { color: #2ecc71; text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
        
        .error-message { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #e74c3c; }
        .success-message { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #2ecc71; }
        
        .info-text { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .register-body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>📚 Student Registration</h1>
            <p>Create your account to start borrowing books</p>
        </div>
        
        <div class="register-body">
            {% if error %}
            <div class="error-message">
                ❌ {{ error }}
            </div>
            {% endif %}
            
            {% if message %}
            <div class="success-message">
                ✅ {{ message }}
            </div>
            {% endif %}
            
            <form method="POST" id="registerForm">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" name="username" required placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label>Student ID *</label>
                        <input type="text" name="student_id" required placeholder="e.g., STU2024001">
                        <div class="info-text">Unique student identification number</div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" name="password" required placeholder="Create a password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" name="confirm_password" required placeholder="Confirm your password">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="full_name" required placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required placeholder="youremail@example.com">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone" placeholder="Optional">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select name="department">
                            <option value="">Select Department</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Business Administration">Business Administration</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Semester</label>
                        <select name="semester">
                            <option value="">Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Year of Study</label>
                        <select name="year_of_study">
                            <option value="">Select Year</option>
                            <option value="1">Year 1</option>
                            <option value="2">Year 2</option>
                            <option value="3">Year 3</option>
                            <option value="4">Year 4</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn-register">📝 Register Now</button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </div>
    </div>
    
    <script>
        // Client-side password match validation
        document.getElementById('registerForm').onsubmit = function(e) {
            let password = document.querySelector('input[name="password"]').value;
            let confirm = document.querySelector('input[name="confirm_password"]').value;
            
            if (password !== confirm) {
                alert('Passwords do not match!');
                e.preventDefault();
                return false;
            }
            
            if (password.length < 4) {
                alert('Password must be at least 4 characters long!');
                e.preventDefault();
                return false;
            }
        };
    </script>
</body>
</html>
